<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统管理控制台 - 登录</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 340px;
            transition: transform 0.3s;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #4a90e2;
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .login-header p {
            color: #888;
            font-size: 13px;
            margin: 5px 0 0 0;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }
        .input-group input:focus {
            outline: none;
            border-color: #4a90e2;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.15);
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.2);
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #357abd;
            box-shadow: 0 6px 15px rgba(74, 144, 226, 0.3);
        }
        /* 底部版权等修饰文字 */
        .footer-tips {
            margin-top: 25px;
            font-size: 11px;
            color: #b0b4b8;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h2>系统管理控制台</h2>
        <p> </p>
    </div>
    
    <form id="adminLoginForm">
        <div class="input-group">
            <label for="username">安全账户</label>
            <input type="text" id="username" placeholder="请输入管理员账号" required autocomplete="off">
        </div>
        <div class="input-group">
            <label for="password">认证密码</label>
            <input type="password" id="password" placeholder="请输入安全令牌/密码" required>
        </div>
        <button type="submit" class="submit-btn">确 认 登 录</button>
    </form>

    <div class="footer-tips">
        海内存知己天涯若比邻?
    </div>
</div>

<script>
   
    document.getElementById('adminLoginForm').addEventListener('submit', function(event) {

        event.preventDefault();
        alert('安全警告：你在想什么呢?');

       
        window.location.href = 'index.html';
    });
</script>

</body>
</html>
